name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "python/signal_harbor/domain/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        run: |
          mkdir -p _site/py/domain
          cp site/index.html _site/
          cp python/signal_harbor/__init__.py _site/py/
          cp python/signal_harbor/domain/__init__.py python/signal_harbor/domain/enums.py python/signal_harbor/domain/risk_policy.py python/signal_harbor/domain/signal_builder.py _site/py/domain/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
