name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw test

  python-fastapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: python
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff bandit pip-audit
      - working-directory: python
        run: ruff check .
      - working-directory: python
        run: bandit -r signal_harbor -ll
      - working-directory: python
        # PYSEC-2026-161/248/249, CVE-2026-48817/48818, CVE-2025-62727: fixed only in
        # starlette 1.x, which fastapi 0.119 does not yet allow (caps at <0.49).
        # CVE-2025-71176: pytest 9 fix, blocked by pytest-httpx's pytest==8.* pin.
        # Dev-only tooling, not shipped in the runtime image. Revisit when fastapi
        # or pytest-httpx lift their pins.
        run: |
          pip-audit \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln CVE-2026-48817 \
            --ignore-vuln CVE-2026-48818 \
            --ignore-vuln CVE-2025-62727 \
            --ignore-vuln CVE-2025-71176
      - working-directory: python
        run: pytest -q

  python-django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: django
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff bandit pip-audit
      - working-directory: django
        run: ruff check .
      - working-directory: django
        run: bandit -r config domain ports services signals -ll
      - working-directory: django
        run: pip-audit
      - working-directory: django
        run: pytest -q
